<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanjas Chatbot</title>
  <style>
    /* General Body Styles */
    body {
      font-family: 'Arial', sans-serif;
      background: #c381b8;
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Chat Container */
    #chat-container {
      background: #47525e;
      border-radius: 12px;
      padding: 20px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.5);
    }

    /* Header Styling */
    #header {
      background: #000000;
      padding: 15px;
      border-radius: 12px 12px 0 0;
      text-align: center;
      color: #fff;
      font-size: 24px;
      font-family: 'Courier New', Courier, monospace;
      margin-bottom: 20px;
    }

    /* Chat Messages Styling */
    .msg {
      margin: 10px 0;
      padding: 12px;
      border-radius: 8px;
      max-width: 70%;
    }

    .user {
      background: #000000;
      text-align: right;
      color: white;
      border-radius: 10px 10px 0 10px;
    }

    .bot {
      background: #ffffff;
      text-align: left;
      color: rgb(0, 0, 0);
      border-radius: 10px 10px 10px 0;
    }

    /* Input Field */
    #input {
      width: 97%;
      padding: 12px;
      margin-top: 15px;
      font-size: 16px;
      background: #000000;
      color: white;
      border: 2px solid #8e7b5c;
      border-radius: 8px;
      outline: none;
    }

    #input:focus {
      border-color: #000000;
    }

    /* Footer Styling */
    #footer {
      font-size: 14px;
      text-align: center;
      color: #bebbb7;
      margin-top: 20px;
    }

    /* Chat Scroll */
    #chat {
      max-height: 400px;
      overflow-y: auto;
    }
    
  </style>
</head>
<body>

  <!-- Chat Container -->
  <div id="chat-container">
    <!-- Header Section -->
    <div id="header">
      Tanjas personlige sla.. hjælper
    </div>

    <!-- Chat Box -->
    <div id="chat">
      <!-- Initial Bot Message -->
      <div class="msg bot">Hej Tanja, når Kasper ikke har tid, så kan jeg hjælpe dig. </div>
    </div>

    <!-- User Input Field -->
    <input id="input" type="text" placeholder="Skriv dit prompt her." />

    <!-- Footer Text -->
    <div id="footer">
      Der er bare nogle spørgsmål som hverken jeg eller google kan svare på :D
    </div>
  </div>

  <!-- Puter.js Script -->
  <script src="https://js.puter.com/v2/"></script>

  <script>
    // Select elements from the page
    const input = document.getElementById('input');
    const chat = document.getElementById('chat');

    // Event listener for the Enter key press
    input.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter' && input.value.trim()) {
        const userMsg = input.value; // Get the user's message
        addMsg('user', userMsg);  // Display user's message
        input.value = '';  // Clear the input field

        // Get bot response using Puter.js
        const reply = await getBotReply(userMsg);
        addMsg('bot', reply);  // Display bot's reply
      }
    });

    // Function to add messages to the chat box
    function addMsg(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;  // Assign the class (either 'user' or 'bot')

      div.innerText = text;  // Set the message text
      chat.appendChild(div);  // Append the message to the chat
      chat.scrollTop = chat.scrollHeight;  // Scroll to the bottom of the chat
    }

    // Function to get bot response from Puter.js API
    async function getBotReply(text) {
      try {
        // Call the Puter API with the user message
        const response = await puter.ai.chat(text, { model: "gpt-4o" });
        return response || "No reply from the bot, try again!";  // Return the response
      } catch (error) {
        console.error("Error fetching reply:", error);
        return "Error processing your request.";  // Fallback error message
      }
    }
  </script>

</body>
</html>
